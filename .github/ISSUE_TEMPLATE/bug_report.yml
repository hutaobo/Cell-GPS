name: Bug report
description: Report a reproducible problem in Cell-GPS.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include a minimal example when possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducible example
      description: Paste the smallest code or command sequence that reproduces the issue.
      render: python
    validations:
      required: false
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or output
      description: Paste the full traceback or command output.
      render: pytb
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Cell-GPS version
      placeholder: "0.0.6"
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and relevant package versions.
      render: shell
    validations:
      required: false
